<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <section class="display" aria-label="Calculator display">
      <span class="previous-value">256 + 44</span>
      <span class="current-value">300</span>
    </section>

    <section class="keypad" aria-label="Calculator keys">
      <button class="key key-muted" type="button">AC</button>
      <button class="key key-muted" type="button">+/-</button>
      <button class="key key-muted" type="button">%</button>
      <button class="key key-muted" type="button" aria-label="Square root">√</button>

      <button class="key" type="button">7</button>
      <button class="key" type="button">8</button>
      <button class="key" type="button">9</button>
      <button class="key key-operator" type="button">÷</button>

      <button class="key" type="button">4</button>
      <button class="key" type="button">5</button>
      <button class="key" type="button">6</button>
      <button class="key key-operator" type="button">×</button>

      <button class="key" type="button">1</button>
      <button class="key" type="button">2</button>
      <button class="key" type="button">3</button>
      <button class="key key-operator" type="button">−</button>

      <button class="key key-zero" type="button">0</button>
      <button class="key" type="button">.</button>
      <button class="key key-operator" type="button">+</button>
      <button class="key key-equals" type="button">=</button>
    </section>
  </main>
</body>
</html>
